[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-monitor-mcp"
version = "0.1.0"
description = "MCP server for your own Telegram account: read chats, and monitor them with keyword rules plus optional Claude-judged relevance filtering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "telegram", "monitoring", "alerting", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "telethon>=1.36.0",
]

[project.optional-dependencies]
# The Claude relevance judge. Without this the monitor still works — every
# prefilter hit just becomes an alert directly.
judge = ["anthropic>=0.69.0", "pydantic>=2.0"]

[project.scripts]
telegram-mcp = "telegram_mcp.server:main"
telegram-mcp-watcher = "telegram_mcp.watcher:main"
telegram-mcp-login = "telegram_mcp.login:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]
